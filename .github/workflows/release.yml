name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rules-mcp-linux
          path: dist
      - name: Verify artifacts
        run: |
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            printf '%s\n' 'Release tag must be vMAJOR.MINOR.PATCH or a prerelease' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # Never overwrite assets of an already published release.
          # A failed upload leaves a draft for inspection, rather than hiding it.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
          gh release upload "$RELEASE_TAG" \
            dist/rules-mcp-linux-amd64 dist/rules-mcp-linux-arm64 \
            dist/*.tar.gz dist/SHA256SUMS dist/LICENSE
          gh release edit "$RELEASE_TAG" --draft=false
