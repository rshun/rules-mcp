name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test and vet
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and package Debian binaries
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: bash scripts/build-release.sh "$BUILD_VERSION"
      - name: Verify native binary and checksums
        run: |
          ./dist/rules-mcp-linux-amd64 -version
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rules-mcp-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/rules-mcp-linux-amd64
            dist/rules-mcp-linux-arm64
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/LICENSE
